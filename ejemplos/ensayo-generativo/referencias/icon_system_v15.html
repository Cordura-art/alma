<script>
'use strict';
const pi=Math.PI,tau=pi*2;
const f2=n=>(+n).toFixed(2);

function mkRng(seed){
  let s=(seed^0xdeadbeef)>>>0;
  const fn=()=>{s=Math.imul(s^(s>>>17),0x45d9f3b);s=(s^(s>>>13))>>>0;return((s^(s>>>15))>>>0)/0xffffffff};
  fn.f=(a,b)=>a+fn()*(b-a);
  fn.i=(a,b)=>Math.floor(fn.f(a,b+.9999));
  fn.b=(p=.5)=>fn()<p;
  fn.pick=a=>a[Math.floor(fn()*a.length)];
  return fn;
}

const PALETTES=[
  {name:'indigo',  c:['#c8c6ff','#9b97f5','#6b64e8','#3d35c0','#1a1060']},
  {name:'glaciar', c:['#c8e6f5','#8ec9e8','#4a9cc4','#1e6fa0','#0d4060']},
  {name:'brasa',   c:['#fff0d6','#f5b84f','#d97c22','#a83d0a','#5c1a02']},
  {name:'botanico',c:['#d4e8c2','#9dc97a','#5b9a3a','#2f6b1e','#153a0b']},
  {name:'arena',   c:['#f0ede8','#d4c9b8','#a89880','#7a6858','#3a2c20']},
  {name:'coral',   c:['#ffd6d6','#ff9999','#e05555','#a82020','#5c0808']},
  {name:'slate',   c:['#e0e8f0','#8eb0cc','#4a7099','#1e4060','#0a1a28']},
];
let PAL_IDX=0, MODE='fill', SW=1.5, PTS=6, CX=3;

const polar=(cx,cy,a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];

function starPath(cx,cy,n,r1,r2,off=0){
  let d='';
  for(let i=0;i<n*2;i++){const a=tau*i/(n*2)+off;const[x,y]=polar(cx,cy,a,i%2===0?r1:r2);d+=(i?'L':'M')+f2(x)+','+f2(y);}
  return d+'Z';
}
function ngon(cx,cy,n,r,off=0){
  let d='';
  for(let i=0;i<n;i++){const a=tau*i/n+off;const[x,y]=polar(cx,cy,a,r);d+=(i?'L':'M')+f2(x)+','+f2(y);}
  return d+'Z';
}

const DOMAINS=[
  'payment','transfer','deposit','credit','debit','escrow','collateral','margin',
  'balance','ledger','settlement','clearing','custody','account','card','wallet',
  'onboarding','kyc','compliance','audit','reconciliation','batch','authorization',
  'authentication','verification','tokenization','encryption','signature',
  'liquidity','solvency','yield','interest','compound','drawdown','portfolio',
  'allocation','diversification','hedge','exposure','risk','spread','velocity',
  'threshold','limit','alert','metric','index','score','forecast','trend','insight',
  'api','webhook','gateway','network','protocol','session','token','node',
  'nft','stablecoin','cbdc','defi','blockchain','vault','equity','bond',
  'loan','mortgage','derivative','swap','repo','fx','acquiring','issuing',
  'interchange','amortization','accrual','valuation','provision','netting',
  'open_banking','monitoring','reporting','statement','analytics','onchain',
];
const ACTIONS=[
  'flow','lock','bridge','gate','loop','pulse','arc','layer',
  'grid','ring','fork','merge','chain','wave','signal','path',
  'orbit','frame','matrix','cluster','band','axis','scale','mark',
  'point','vector','stack','shield','field','route','branch','node',
];

function conceptHash(domain,action){
  let h=0x811c9dc5>>>0;
  for(const c of domain+'\x00'+action) h=Math.imul(h^c.charCodeAt(0),0x01000193)>>>0;
  return h;
}
function extractTraits(h){
  const b=(sh,bits)=>(h>>>sh)&((1<<bits)-1);
  return{n:3+b(0,4)%12,n2:2+b(4,3)%6,ratio:b(8,8)/255,angle:b(16,8)/255*pi,
    decay:.52+b(24,6)/255*.36,phase:b(2,8)/255*tau,flip:!!(h&(1<<10)),
    alt:!!(h&(1<<11)),sub:!!(h&(1<<12)),mode:b(13,2),variant:b(18,3),weight:b(21,3),h};
}

const pickC=(pal,r)=>pal[Math.floor(r()*pal.length)];
let _mid=0;
const mid=()=>'m'+((_mid++)&0xffff).toString(16);

// ── DRAW FUNCTIONS ─────────────────────────────
// Each: (S, r, T, pal, imode, pts, cx) → SVG string
const DRAWS=[

// 00 starburst
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,inner=R*(.18+T.ratio*.35);
  const c1=pickC(pal,r),c2=pickC(pal,r),c3=pickC(pal,r),lm=im==='line';
  let o=`<path d="${starPath(h,h,pts,R,inner)}" fill="${lm?'none':c1}" stroke="${lm?c1:'none'}" stroke-width="${SW}" stroke-linejoin="round"/>`;
  if(cx>2) o+=`<path d="${starPath(h,h,pts,inner*1.1,inner*.35,pi/pts)}" fill="${lm?'none':c2}" stroke="${lm?c2:'none'}" stroke-width="${SW}"/>`;
  if(cx>3) o+=`<circle cx="${h}" cy="${h}" r="${inner*.4}" fill="${c3}"/>`;
  return o;
},

// 01 asterisk — thick bars
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,th=R*(.055+T.ratio*.065),lm=im==='line';
  const c2=pickC(pal,r);
  let o='';
  for(let i=0;i<pts;i++){
    const a=tau*i/pts+T.phase/pts,p2=a+pi/2;
    const [x2,y2]=polar(h,h,a,R);
    const ox=Math.cos(p2)*th,oy=Math.sin(p2)*th;
    const col=pal[i%pal.length];
    o+=`<path d="M${f2(h+ox)},${f2(h+oy)} L${f2(x2+ox)},${f2(y2+oy)} L${f2(x2-ox)},${f2(y2-oy)} L${f2(h-ox)},${f2(h-oy)}Z" fill="${lm?'none':col}" stroke="${lm?col:'none'}" stroke-width="${SW}"/>`;
  }
  if(cx>2) o+=`<circle cx="${h}" cy="${h}" r="${th*2.2}" fill="${c2}"/>`;
  return o;
},

// 02 ring_dots
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,rings=Math.min(cx,3),lm=im==='line';
  let o='';
  for(let ri=0;ri<rings;ri++){
    const rad=R*(.28+ri*.26),n=pts+ri*2,dotR=R*(.058-ri*.008);
    for(let i=0;i<n;i++){
      const a=tau*i/n+T.phase;const[x,y]=polar(h,h,a,rad);
      const col=pal[ri%pal.length];
      o+=`<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(dotR)}" fill="${lm?'none':col}" stroke="${lm?col:'none'}" stroke-width="${SW}"/>`;
    }
  }
  if(cx>3) o+=`<circle cx="${h}" cy="${h}" r="${R*.1}" fill="${pal[2]}"/>`;
  return o;
},

// 03 spiral
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.9,turns=1.4+cx*.45,steps=pts*cx*4;
  const c1=pal[0],c2=pal[2];
  const mkS=(ph)=>{let d=`M${h},${h}`;for(let i=1;i<=steps;i++){const t=i/steps,a=t*tau*turns+ph,rad=t*R;const[x,y]=polar(h,h,a,rad);d+=`L${f2(x)},${f2(y)}`;}return d;};
  let o=`<path d="${mkS(T.phase)}" fill="none" stroke="${c1}" stroke-width="${SW}" stroke-linecap="round"/>`;
  if(cx>2) o+=`<path d="${mkS(T.phase+pi)}" fill="none" stroke="${c2}" stroke-width="${SW*.8}" stroke-linecap="round"/>`;
  return o;
},

// 04 radial_lines
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.9,n=pts*cx;
  let o='';
  for(let i=0;i<n;i++){
    const a=tau*i/n+T.phase/n;
    const[x1,y1]=polar(h,h,a,R*(.12+T.ratio*.2));
    const[x2,y2]=polar(h,h,a,R*(.62+T.ratio*.35));
    o+=`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="${pal[i%pal.length]}" stroke-width="${SW}" stroke-linecap="round"/>`;
  }
  return o;
},

// 05 cross_burst — alternating long/short
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.9,lm=im==='line',c1=pickC(pal,r),c2=pickC(pal,r);
  let o='';
  for(let i=0;i<pts*2;i++){
    const a=tau*i/(pts*2)+T.phase,long=i%2===0;
    const rr=long?R*.9:R*.52,th=R*(.06+T.ratio*.06)*(long?1:.65);
    const p2=a+pi/2,ox=Math.cos(p2)*th,oy=Math.sin(p2)*th;
    const[x2,y2]=polar(h,h,a,rr),col=long?c1:c2;
    o+=`<path d="M${f2(h+ox)},${f2(h+oy)} L${f2(x2+ox)},${f2(y2+oy)} L${f2(x2-ox)},${f2(y2-oy)} L${f2(h-ox)},${f2(h-oy)}Z" fill="${lm?'none':col}" stroke="${lm?col:'none'}" stroke-width="${SW}"/>`;
  }
  o+=`<circle cx="${h}" cy="${h}" r="${R*(.1+T.ratio*.08)}" fill="${pal[4]}" stroke="none"/>`;
  return o;
},

// 06 nested_stars
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,inner=R*.35,lm=im==='line';
  let o=`<path d="${starPath(h,h,pts,R*.9,inner)}" fill="${lm?'none':pal[0]}" stroke="${lm?pal[0]:'none'}" stroke-width="${SW}" stroke-linejoin="round"/>`;
  o+=`<path d="${starPath(h,h,pts,inner*1.15,inner*.32,pi/pts)}" fill="${lm?'none':pal[2]}" stroke="${lm?pal[2]:'none'}" stroke-width="${SW}" stroke-linejoin="round"/>`;
  if(cx>2) o+=`<circle cx="${h}" cy="${h}" r="${R*.09}" fill="${pal[4]}"/>`;
  return o;
},

// 07 orbital
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.85,tilt=T.angle*180/pi;
  const rx=R*(.62+T.ratio*.28),ry=rx*(.22+T.ratio*.28);
  const sa=T.phase,sx=h+rx*Math.cos(sa)*Math.cos(T.angle)-ry*Math.sin(sa)*Math.sin(T.angle);
  const sy=h+rx*Math.cos(sa)*Math.sin(T.angle)+ry*Math.sin(sa)*Math.cos(T.angle);
  let o='';
  const nn=cx>3?2:1;
  for(let i=0;i<nn;i++) o+=`<ellipse cx="${h}" cy="${h}" rx="${f2(rx*(1-i*.28))}" ry="${f2(ry*(1-i*.28))}" transform="rotate(${f2(tilt+i*25)} ${h} ${h})" fill="none" stroke="${pal[i*2]}" stroke-width="${SW}"/>`;
  o+=`<circle cx="${h}" cy="${h}" r="${R*(.1+T.ratio*.07)}" fill="${pal[0]}"/>`;
  o+=`<circle cx="${f2(sx)}" cy="${f2(sy)}" r="${R*(.045+T.ratio*.04)}" fill="${pal[3]}"/>`;
  return o;
},

// 08 arc_flower
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.85,pR=R*(.42+T.ratio*.22),lm=im==='line';
  let o='';
  for(let i=0;i<pts;i++){
    const a=tau*i/pts+T.phase;
    const[pcx,pcy]=polar(h,h,a,pR*.7),col=pal[i%pal.length];
    o+=`<ellipse cx="${f2(pcx)}" cy="${f2(pcy)}" rx="${f2(pR*.45)}" ry="${f2(pR*.28)}" transform="rotate(${f2(a*180/pi+90)} ${f2(pcx)} ${f2(pcy)})" fill="${lm?'none':col}" stroke="${lm?col:'none'}" stroke-width="${SW}" opacity="${.75+T.ratio*.2}"/>`;
  }
  o+=`<circle cx="${h}" cy="${h}" r="${R*.14}" fill="${pal[2]}"/>`;
  return o;
},

// 09 thorn
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,n=pts*2,lm=im==='line';
  let d='';
  for(let i=0;i<n;i++){
    const a=tau*i/n+T.phase/n,t=i%3;
    const rad=t===0?R*.92:t===1?R*(.38+T.ratio*.2):R*(.62+T.ratio*.18);
    const[x,y]=polar(h,h,a,rad);d+=(i?'L':'M')+f2(x)+','+f2(y);
  }
  return`<path d="${d}Z" fill="${lm?'none':pal[0]}" stroke="${lm?pal[0]:pal[3]}" stroke-width="${SW}" stroke-linejoin="round"/>`;
},

// 10 lens_burst
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,n=Math.min(cx,4);
  let o='';
  for(let i=0;i<n;i++){
    const rr=R*(.28+i*.2),span=pi*(.6+T.ratio*.9),base=T.phase+i*.22;
    const gap=.06+T.ratio*.1,a0=base+gap,a1=base+span-gap;
    const[sx,sy]=polar(h,h,a0,rr),[ex,ey]=polar(h,h,a1,rr);
    const lg=span>pi?1:0;
    o+=`<path d="M${f2(sx)} ${f2(sy)} A${f2(rr)} ${f2(rr)} 0 ${lg} 1 ${f2(ex)} ${f2(ey)}" fill="none" stroke="${pal[i%pal.length]}" stroke-width="${SW}" stroke-linecap="round"/>`;
  }
  for(let i=0;i<pts;i++){
    const a=tau*i/pts+T.phase;
    const[x1,y1]=polar(h,h,a,R*.15),[x2,y2]=polar(h,h,a,R*.88);
    o+=`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="${pal[i%pal.length]}" stroke-width="${SW*.5}" stroke-linecap="round" opacity=".5"/>`;
  }
  return o;
},

// 11 hex_core
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.9,layers=Math.min(cx,4),lm=im==='line';
  let o='';
  for(let l=layers-1;l>=0;l--){
    const hexR=R*(.95-l*.26),col=pal[l%pal.length];
    o+=`<path d="${ngon(h,h,6,hexR,pi/6)}" fill="${lm?'none':col}" stroke="${lm?col:(l>0?pal[4]:'none')}" stroke-width="${lm?SW:SW*.6}" stroke-linejoin="round"/>`;
  }
  if(cx>3){for(let i=0;i<6;i++){const a=pi/3*i+pi/6;const[x,y]=polar(h,h,a,R*.54);o+=`<circle cx="${f2(x)}" cy="${f2(y)}" r="${R*.06}" fill="${pal[2]}"/>`;}}
  return o;
},

// 12 feather_radial
(S,r,T,pal,im,pts,cx)=>{
  const h=S/2,R=h*.88,r2=mkRng(T.h^0xabcd);
  let o='';
  for(let i=0;i<pts;i++){
    const a=tau*i/pts+T.phase,barbN=cx+2,col=pal[i%2===0?0:2];
    for(let j=0;j<barbN;j++){
      const t=j/barbN,bR=R*.14+t*(R*.82-R*.14);
      const[bx,by]=polar(h,h,a,bR),bLen=R*(.07+r2.f(0,.05))*(1-t*.5),ba=a+pi/2;

// ── CONCEPT GENERATION ─────────────────────────
function generateConcepts(masterSeed,n){
  const r=mkRng(masterSeed);
  const used=new Set();
  const shuffled=[];
  const cycles=Math.ceil(n/DRAWS.length);
  for(let c=0;c<cycles;c++){
    const tile=DRAWS.map((_,i)=>i);
    for(let i=tile.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[tile[i],tile[j]]=[tile[j],tile[i]];}
    shuffled.push(...tile);
  }
  const list=[];
  for(let i=0;i<n;i++){
    let domain,action,label,tries=0;
    do{domain=DOMAINS[Math.floor(r()*DOMAINS.length)];action=ACTIONS[Math.floor(r()*ACTIONS.length)];label=`${domain} ${action}`;tries++;}
    while(used.has(label)&&tries<60);
    used.add(label);
    const h=conceptHash(domain,action);
    const drawSeed=((h*1664525+1013904223)>>>0)^(masterSeed&0xffff);
    list.push({label,domain,action,drawIdx:shuffled[i],drawSeed,h});
  }
  return list;
}

function resolveMode(concept,globalMode){
  if(globalMode!=='mix') return globalMode;
  return concept.h%3===0?'line':concept.h%7===0?'contra':'fill';
}

function renderConcept(concept,S=72){
  const v=+document.getElementById('sl-v').value;
  const varSeed=(concept.drawSeed+Math.round(v*4999))>>>0;
  const r=mkRng(varSeed);
  const T=extractTraits(concept.h);
  const pal=PALETTES[PAL_IDX].c;
  const imode=resolveMode(concept,MODE);
  const bg=(imode==='contra'||MODE==='contra')?'#000':'#0d0d0d';
  return`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg"><rect width="${S}" height="${S}" fill="${bg}"/>${DRAWS[concept.drawIdx](S,r,T,pal,imode,PTS,CX)}</svg>`;
}

// ── APP STATE ──────────────────────────────────
let MASTER=4096,CONCEPTS=[],FROZEN={},PINNED=[];
function refresh(){const n=+document.getElementById('sl-n').value;const fresh=generateConcepts(MASTER,n);CONCEPTS=fresh.map((c,i)=>FROZEN[i]||c);}

function buildGrid(){
  SW=+document.getElementById('sl-sw').value;
  PTS=+document.getElementById('sl-pts').value;
  CX=+document.getElementById('sl-cx').value;
  const grid=document.getElementById('grid');grid.innerHTML='';
  CONCEPTS.forEach((c,i)=>{
    const svg=renderConcept(c);
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML=`${svg}<span class="cell-nm">${c.label}</span><span class="pin${FROZEN[i]?' on':''}" data-i="${i}">◈</span>`;
    cell.querySelector('.pin').addEventListener('click',e=>{e.stopPropagation();const idx=+e.currentTarget.dataset.i;if(FROZEN[idx]){delete FROZEN[idx];e.currentTarget.classList.remove('on');}else{FROZEN[idx]=c;e.currentTarget.classList.add('on');}});
    cell.addEventListener('click',e=>{if(!e.target.classList.contains('pin'))showPanel(c,i);});
    grid.appendChild(cell);
  });
  document.getElementById('gi').textContent=`${CONCEPTS.length} conceptos · semilla ${MASTER} · ${DOMAINS.length*ACTIONS.length} combinaciones · ${PALETTES[PAL_IDX].name} · ${MODE}`;
}

function showPanel(c,i){
  SW=+document.getElementById('sl-sw').value;PTS=+document.getElementById('sl-pts').value;CX=+document.getElementById('sl-cx').value;
  document.getElementById('p-svg').innerHTML=renderConcept(c,120);
  document.getElementById('p-nm').textContent=c.label;
  document.getElementById('p-id').textContent=`draw #${c.drawIdx} · seed 0x${(c.drawSeed&0xffff).toString(16).padStart(4,'0')} · slot ${i}`;
  document.getElementById('p-dc').textContent=`${c.domain} — ${c.action}`;
  document.getElementById('p-lg').textContent=`hash 0x${c.h.toString(16).padStart(8,'0')} · variant ${extractTraits(c.h).variant}`;
  document.getElementById('p-cp').onclick=()=>{navigator.clipboard.writeText(renderConcept(c,120)).catch(()=>{});document.getElementById('p-cp').textContent='✓';setTimeout(()=>document.getElementById('p-cp').textContent='copiar SVG',1400);};
  document.getElementById('p-an').onclick=()=>{PINNED.push(c);buildBoard();document.getElementById('p-an').textContent='✓';setTimeout(()=>document.getElementById('p-an').textContent='+ anclar',1400);};
  document.getElementById('p-fz').onclick=()=>{FROZEN[i]=c;buildGrid();document.getElementById('p-fz').textContent='✓';setTimeout(()=>document.getElementById('p-fz').textContent='❄ fijar',1400);};
  document.getElementById('panel').className='panel show';
}

function buildBoard(){
  SW=+document.getElementById('sl-sw').value;PTS=+document.getElementById('sl-pts').value;CX=+document.getElementById('sl-cx').value;
  const g=document.getElementById('bgr');g.innerHTML='';
  PINNED.forEach((c,i)=>{const cell=document.createElement('div');cell.className='bc';cell.innerHTML=renderConcept(c,48)+`<span>${c.label}</span>`;cell.addEventListener('click',()=>showPanel(c,CONCEPTS.length+i));g.appendChild(cell);});
  document.getElementById('btn-b').textContent=`tablero${PINNED.length?' ('+PINNED.length+')':''}`;
  document.getElementById('board').className=PINNED.length?'board show':'board';
}

function buildSwatches(){
  const row=document.getElementById('sw-pal');row.innerHTML='';
  PALETTES.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='sw'+(i===PAL_IDX?' on':'');
    d.style.background=p.c[2];d.title=p.name;
    d.addEventListener('click',()=>{PAL_IDX=i;buildSwatches();buildGrid();});
    row.appendChild(d);
  });
}

function setMode(m){
  MODE=m;
  ['fill','line','mix','contra'].forEach(x=>document.getElementById('m-'+x).classList.toggle('on',x===m));
  buildGrid();
}
['fill','line','mix','contra'].forEach(m=>document.getElementById('m-'+m).addEventListener('click',()=>setMode(m)));

function sl(id,tvId,fmt,cb){document.getElementById(id).addEventListener('input',e=>{document.getElementById(tvId).textContent=fmt(+e.target.value);cb(+e.target.value);});}
sl('sl-s','tv-s',v=>v,v=>{MASTER=v;FROZEN={};refresh();buildGrid();document.getElementById('panel').className='panel';});
sl('sl-n','tv-n',v=>v,()=>{refresh();buildGrid();document.getElementById('panel').className='panel';});
sl('sl-v','tv-v',v=>v.toFixed(2),()=>buildGrid());
sl('sl-sw','tv-sw',v=>v.toFixed(1),v=>{SW=v;buildGrid();});
sl('sl-pts','tv-pts',v=>v,v=>{PTS=v;buildGrid();});
sl('sl-cx','tv-cx',v=>v,v=>{CX=v;buildGrid();});
document.getElementById('btn-new').addEventListener('click',()=>{MASTER=Math.floor(Math.random()*99998)+1;FROZEN={};document.getElementById('sl-s').value=MASTER;document.getElementById('tv-s').textContent=MASTER;refresh();buildGrid();document.getElementById('panel').className='panel';});
document.getElementById('btn-evo').addEventListener('click',()=>{MASTER=((MASTER*1664525+1013904223)&0xfffe)>>>0||1;document.getElementById('sl-s').value=Math.min(MASTER,99999);document.getElementById('tv-s').textContent=MASTER;refresh();buildGrid();});
document.getElementById('btn-b').addEventListener('click',()=>{const b=document.getElementById('board');b.className=b.classList.contains('show')?'board':'board show';});
document.getElementById('btn-ex').addEventListener('click',()=>{SW=+document.getElementById('sl-sw').value;PTS=+document.getElementById('sl-pts').value;CX=+document.getElementById('sl-cx').value;const svgs=CONCEPTS.map(c=>`<!-- ${c.label} -->\n${renderConcept(c,96)}`).join('\n');navigator.clipboard.writeText(svgs).catch(()=>{});document.getElementById('btn-ex').textContent='✓';setTimeout(()=>document.getElementById('btn-ex').textContent='↓ exportar',1600);});
buildSwatches();refresh();buildGrid();
</script>
</body>
</html>
