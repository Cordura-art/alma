name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Los archivos generados están al día
        run: git diff --exit-code -- dist || (echo "::error::Corre npm run build y sube dist/." && exit 1)
      - run: npm test
