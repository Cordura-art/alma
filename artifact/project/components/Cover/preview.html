<!-- @dsCard height=300 -->
<div class="cv">
  <!--
    art: ALMA's field, the same generative piece every entity signs with: particles carried by currents, leaving trails
    arrangement: the name on the left; the field on the right, flush, bleeding off the top, the bottom and the right edge
    colors: on brand-ink, with ALMA's blue (primary and tertiary), its grays (secondary) and interactive-01 as the accent
    seed: Cordura's birth, as ALMA is Cordura's system. Drawn once and left still: no text goes on top of it
  -->
  <canvas id="cv-campo" class="art" width="896" height="600" aria-hidden="true"></canvas>
  <div class="txt">
    <div class="name">ALMA</div>
    <div class="tag">Sistema de diseño de Cordura, un estudio de lenguajes de movimiento.</div>
  </div>
</div>
<script>
(function () {
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  document.body.style.margin = '0';
  var s = document.createElement('style');
  s.textContent = [
    '.cv{position:relative;width:960px;height:300px;background:var(--ui-02);overflow:hidden}',
    '.art{position:absolute;right:0;top:0;width:448px;height:300px;background:var(--brand-ink)}',
    '.txt{position:absolute;left:40px;bottom:32px;max-width:440px}',
    '.name{font-family:var(--font-flex);font-stretch:calc(var(--font-width, 150) * 1%);font-variation-settings:"wdth" var(--font-width, 150), "GRAD" var(--font-grade, 0);font-weight:var(--font-weight-display);font-size:112px;line-height:.92;color:var(--text-01);letter-spacing:0}',
    '.tag{margin-top:16px;font-family:var(--font-flex);font-stretch:calc(var(--font-width, 150) * 1%);font-size:13px;line-height:1.4;color:var(--text-02)}'
  ].join('\n');
  document.head.appendChild(s);

  /* @campo:start */
  // Generated by scripts/build-portada.mjs from entidades/semilla.mjs and entidades/campo.mjs. Do not edit here.
// The seed of everything an entity generates: a hash of a key, a random sequence that always repeats for the same seed,
// and the traits of a key. The same entity and the same key always give the same drawing.
// No imports and no DOM: the builds bundle this file into pages (without its `export` words) and Node tests it.

function hash(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// The same randomness with the helpers the drawings use: a float in a range, an integer in a range, a coin.
function azar(seed) { const fn = rng(seed); fn.f = (a, b) => a + fn() * (b - a); fn.i = (a, b) => Math.floor(fn.f(a, b + 0.9999)); fn.b = (p = 0.5) => fn() < p; return fn; }
// The traits of a key, read from the bits of its hash (the user's v14 study): counts, proportions, angles, switches and
// `variant` (0–7), which picks a drawing's composition. The same key always has the same traits.
function rasgos(h) {
  const b = (shift, bits) => (h >>> shift) & ((1 << bits) - 1), pi = Math.PI;
  return { n: 3 + b(0, 4) % 12, n2: 2 + b(4, 3) % 6, ratio: b(8, 8) / 255, angle: b(16, 8) / 255 * pi, decay: 0.52 + b(24, 6) / 255 * 0.36, phase: b(2, 8) / 255 * pi * 2,
    flip: !!(h & (1 << 10)), alt: !!(h & (1 << 11)), sub: !!(h & (1 << 12)), mode: b(13, 2), variant: b(18, 3), weight: b(21, 3), h };
}

// The field of an entity: particles carried by a noise field and a steady wind, leaving trails. It is the user's p5
// study (ejemplos/ensayo-generativo/referencias/campo-de-particulas-p5.js) without p5: the same motion, with the entity's colors instead of the
// pointer's hue, the entity's genes instead of sliders, and a seed, so the same key always gives the same field.
// `campo()` is the simulation (no DOM: Node tests it); `pintarCampo()` draws one frame on a canvas 2D context.


// Seeded value noise in three dimensions, three octaves, between 0 and 1 (what p5's noise() gave the original).
function ruido(seed) {
  const r = rng(seed), p = new Uint8Array(512), v = new Float32Array(256);
  for (let i = 0; i < 256; i++) { p[i] = i; v[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)), t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const s = (t) => t * t * (3 - 2 * t), l = (a, b, t) => a + (b - a) * t;
  const una = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), X = xi & 255, Y = yi & 255, Z = zi & 255, u = s(x - xi), w = s(y - yi), q = s(z - zi);
    const g = (i, j, k) => v[p[p[p[X + i] + Y + j] + Z + k]];
    return l(l(l(g(0, 0, 0), g(1, 0, 0), u), l(g(0, 1, 0), g(1, 1, 0), u), w), l(l(g(0, 0, 1), g(1, 0, 1), u), l(g(0, 1, 1), g(1, 1, 1), u), w), q);
  };
  return (x, y, z) => (una(x, y, z) * 4 + una(x * 2, y * 2, z * 2) * 2 + una(x * 4, y * 4, z * 4)) / 7;
}

// A field of `ancho` × `alto` pixels. The entity decides: the pace (its type's speed: a slower entity drifts slower),
// how many currents (one scale of noise per group of its definition: more groups, smaller eddies), the size of a
// particle (its stroke) and the colors (its piece palette, with the accent on one particle in twelve).
// The amount of particles follows the area, up to `max`. `avanzar()` moves every particle one step of 1/60 s.
function campo(G, clave, ancho, alto, o = {}) {
  const r = rng(hash(`campo|${G.semilla}|${clave}`)), n3 = ruido(hash(`ruido|${G.semilla}|${clave}`)), C = G.pieza;
  const n = Math.max(200, Math.min(o.max ?? 9000, Math.round(ancho * alto * (o.densidad ?? 0.012))));
  const x = new Float32Array(n), y = new Float32Array(n), color = new Uint8Array(n), colores = [...C.barras, C.acento];
  for (let i = 0; i < n; i++) { x[i] = r() * ancho; y[i] = r() * alto; color[i] = r() < 1 / 12 ? C.barras.length : Math.floor(r() * C.barras.length); }
  const escala = 360 / G.grupos, fuerza = 1.2, paso = 1 / G.ritmo, giro = Math.PI * 2 * fuerza;
  const F = { n, ancho, alto, x, y, color, colores, base: C.base, radio: 1.5 * G.trazo, t: 0, escala, paso };
  F.avanzar = () => {
    const z = F.t / escala;
    for (let i = 0; i < n; i++) {
      const a = n3(x[i] / escala, y[i] / escala, z) * giro, c = Math.cos(a), s = Math.sin(a);
      // The original's direction: the field's, plus a wind of one step to the right.
      x[i] += (c + 1) * paso; y[i] += (s - c * s) * paso;
      if (x[i] < 0 || x[i] > ancho || y[i] < 0 || y[i] > alto) { x[i] = r() * ancho; y[i] = r() * alto; }
    }
    F.t++;
  };
  return F;
}

// One frame: a veil of the ground's color over what was there (the trails fade), then every particle, color by color.
function pintarCampo(ctx, F) {
  ctx.globalAlpha = 0.09; ctx.fillStyle = F.base; ctx.fillRect(0, 0, F.ancho, F.alto); ctx.globalAlpha = 1;
  for (let k = 0; k < F.colores.length; k++) {
    ctx.fillStyle = F.colores[k]; ctx.beginPath();
    for (let i = 0; i < F.n; i++) if (F.color[i] === k) { ctx.moveTo(F.x[i] + F.radio, F.y[i]); ctx.arc(F.x[i], F.y[i], F.radio, 0, Math.PI * 2); }
    ctx.fill();
  }
}
  /* @campo:end */

  // ALMA's genes for the field: its colors, read from the tokens of the page, and Cordura's seed.
  var cs = getComputedStyle(document.documentElement), tok = function (n) { return cs.getPropertyValue('--' + n).trim(); };
  var G = { semilla: 'nac|1987-03-31|10:45|America/Santiago', grupos: 2, ritmo: 1, trazo: 1,
    pieza: { base: tok('brand-ink'), barras: [tok('primary-300'), tok('primary-500'), tok('tertiary-400'), tok('secondary-50'), tok('secondary-500')], acento: tok('interactive-01') } };
  var cv = document.getElementById('cv-campo');
  if (cv && cv.getContext && G.pieza.base) {
    var ctx = cv.getContext('2d'), F = campo(G, 'portada', 448, 300);
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.fillStyle = F.base; ctx.fillRect(0, 0, F.ancho, F.alto);
    for (var i = 0; i < 90; i++) { F.avanzar(); pintarCampo(ctx, F); }
  }
})();
</script>
