<!-- @dsCard height=300 -->
<div class="cv">
  <svg class="art" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!--
      blocks: brand-lime 232x300 bleeding top/bottom, brand-steel 176x148, brand-ink 176x144 (dark ground shows it via ui-01), secondary-700 104x300 slab
      arrangement: one tall lime slab with satellites, flush right, bleeding off top and bottom edges
      pattern: pills — the system's one shape is the radius-pill button, so 12 pills at space-16 pitch cut across the steel and lime blocks
      scales: gaps space-8 / space-16, pill height 32 (button sm), rx = half height (radius-pill)
    -->
    <rect class="b-slab" x="512" y="0" width="104" height="300"/>
    <rect class="b-steel" x="624" y="0" width="176" height="148"/>
    <rect class="b-ink" x="624" y="156" width="176" height="144"/>
    <rect class="b-lime" x="808" y="0" width="152" height="300"/>
    <g class="pills">
      <rect class="p-ink" x="640" y="24" width="120" height="32" rx="16"/>
      <rect class="p-ink" x="640" y="64" width="88" height="32" rx="16"/>
      <rect class="p-ink" x="640" y="104" width="136" height="32" rx="16"/>
      <rect class="p-lime" x="640" y="180" width="104" height="32" rx="16"/>
      <rect class="p-steel" x="640" y="220" width="144" height="32" rx="16"/>
      <rect class="p-ink" x="824" y="40" width="120" height="32" rx="16"/>
      <rect class="p-ink" x="824" y="88" width="72" height="32" rx="16"/>
      <rect class="p-ink" x="824" y="136" width="104" height="32" rx="16"/>
      <rect class="p-ink" x="824" y="184" width="120" height="32" rx="16"/>
      <rect class="p-ink" x="824" y="232" width="56" height="32" rx="16"/>
      <rect class="p-lime" x="528" y="120" width="72" height="32" rx="16"/>
      <rect class="p-steel" x="528" y="160" width="72" height="32" rx="16"/>
    </g>
  </svg>
  <div class="txt">
    <div class="name">ALMA</div>
    <div class="tag">Sistema de diseño de Cordura, un estudio de lenguajes de movimiento.</div>
  </div>
</div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  document.body.style.margin = '0';
  var s = document.createElement('style');
  s.textContent = [
    '.cv{position:relative;width:960px;height:300px;background:var(--ui-02);overflow:hidden}',
    '.art{position:absolute;inset:0;width:960px;height:300px}',
    '.b-lime,.p-lime{fill:var(--brand-lime)}',
    '.b-steel,.p-steel{fill:var(--brand-steel)}',
    '.b-ink{fill:var(--brand-ink)}',
    '.p-ink{fill:var(--brand-ink)}',
    '.b-slab{fill:var(--secondary-700)}',
    '.txt{position:absolute;left:40px;bottom:32px;max-width:440px}',
    '.name{font-family:var(--font-flex);font-stretch:calc(var(--font-width, 150) * 1%);font-variation-settings:"wdth" var(--font-width, 150), "GRAD" var(--font-grade, 0);font-weight:600;font-size:112px;line-height:.92;color:var(--text-01);letter-spacing:0}',
    '.tag{margin-top:16px;font-family:var(--font-flex);font-stretch:calc(var(--font-width, 150) * 1%);font-size:13px;line-height:1.4;color:var(--text-02)}'
  ].join('\n');
  document.head.appendChild(s);
</script>
