<!-- @dsCard group="Contenido" height=460 subtitle="Tarjeta de pago en 4 estados" -->
<div id="root" style="padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(311px,1fr));gap:16px;background:var(--brand-black);"></div>
<script>
  var h = React.createElement, C = AlmaDS.PaymentCard;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(C, { brand: 'C.WalletPay', status: 'pending', last4: '0000' }),
    h(C, { brand: 'C.WalletPay', status: 'activating', last4: '0637' }),
    h(C, { brand: 'C.WalletPay', status: 'enabled', last4: '7637' }),
    h(C, { brand: 'C.WalletPay', status: 'active', number: '5432  8765  7654  7 6 3 7', expiry: '08/29' })
  ));
</script>
