<script>
  var h = React.createElement, A = AlmaDS;
  function Demo() {
    var o = React.useState(false);
    return h(React.Fragment, null,
      h(A.Alert, { open: true, inline: true, title: '¿Eliminar la tarjeta C.WalletPay?', message: 'Los pagos programados con esta tarjeta se cancelarán. No se puede deshacer.',

        actions: [{ label: 'Reintentar', role: 'default' }, { label: 'Ver estado del servicio' }, { label: 'Cancelar', role: 'cancel' }] }),
      h('div', null,
        h(A.Button, { variant: 'gray', onClick: function () { o[1](true); } }, 'Abrir alerta real…'),
        h(A.Alert, { open: o[0], title: 'Confirma tu contraseña', message: 'La necesitamos para cambiar el límite.',

          h(A.TextInput, { label: 'Contraseña', type: 'password' })))

  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
