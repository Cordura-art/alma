<div id="root" style="padding:24px;display:grid;gap:32px;max-width:720px;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty("background", "var(--ui-02)", "important");
  var h = React.createElement, A = AlmaDS;
  function fila(t, el) { return h('div', { style: { display: 'grid', gap: '8px', justifyItems: 'start' } }, h('p', { className: 'web-label-s', style: { margin: 0, color: 'var(--text-02)' } }, t), el); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    fila('Sola: dice que es generado', h(A.AILabel)),
    fila('Con explicación: se abre', h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, h('h2', { className: 'web-h5', style: { margin: 0 } }, 'Resumen de tu viaje'),
      h(A.AILabel, { what: 'Resumí tu pasaje y los avisos de la empresa.', when: 'Hoy, 09:12', review: 'Revisa la hora de salida antes de viajar.', detailHref: '#' }))),
    fila('Editado por la persona: se puede volver', h(A.AILabel, { edited: true, what: 'Escribí este borrador y tú lo cambiaste.', when: 'Hoy, 09:20', onRevert: function () {} })),
    fila('Tamaño md, junto a un título grande', h(A.AILabel, { size: 'md' }))));
</script>
