<!-- @dsCard group="Formularios" height=460 subtitle="Botón o zona para arrastrar · subiendo · listo · error" -->
<div id="root" style="padding:24px;display:grid;gap:32px;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  var h = React.createElement, A = AlmaDS;
  function Demo() {
    var f = React.useState([
      { id: 1, name: 'cedula-identidad-frente.jpg', status: 'complete' },
      { id: 2, name: 'comprobante-domicilio-marzo-2026-banco-estado.pdf', status: 'uploading' },
      { id: 3, name: 'liquidacion-sueldo.heic', status: 'error', error: 'Formato no permitido. Sube un PDF o JPG.' }
    ]);
    return h(React.Fragment, null,
      h(A.FileUploader, { title: 'Documentos de identidad', description: 'PDF o JPG, hasta 5 MB cada uno.', dropZone: true, multiple: true, files: f[0],
        onAdd: function (list) { f[1](f[0].concat(list.map(function (x, i) { return { id: Date.now() + i, name: x.name, status: 'complete' }; }))); },
        onRemove: function (x) { f[1](f[0].filter(function (y) { return y.id !== x.id; })); } }),
      h(A.FileUploader, { title: 'Foto de perfil', description: 'JPG o PNG cuadrado, hasta 2 MB.', accept: 'image/*' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
