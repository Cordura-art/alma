<!-- @dsCard group="Selección" height=220 subtitle="Jerarquías · estado mixto" -->
<div id="root" style="padding:24px;display:grid;gap:0;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  var h = React.createElement, C = AlmaDS.Checkbox;
  function Demo() {
    var a = React.useState(true), b = React.useState(false);
    var all = a[0] && b[0], some = a[0] || b[0];
    return h(React.Fragment, null,
      h(C, { label: 'Todos los medios de pago', checked: all, indeterminate: some && !all, onChange: function (v) { a[1](v); b[1](v); } }),
      h('div', { style: { paddingLeft: 28, display: 'grid' } },
        h(C, { label: 'Tarjeta C.WalletPay', checked: a[0], onChange: a[1] }),
        h(C, { label: 'Transferencia', checked: b[0], onChange: b[1] })),
      h(C, { label: 'Recordar en este dispositivo', disabled: true }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
