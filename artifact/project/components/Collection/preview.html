<!-- @dsCard group="Contenido" height=520 subtitle="Ítems que se miran más que se leen · en grilla o en una fila que se desplaza" -->
<div id="root" style="padding:24px;display:grid;gap:32px;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  var h = React.createElement, A = AlmaDS;
  var D = ['Viña del Mar', 'Valparaíso', 'Talca', 'Chillán', 'Concepción', 'Temuco'].map(function (t, i) { return { id: t, t: t, km: [120, 115, 255, 400, 500, 680][i] }; });
  function celda(it) { return h(A.Card, { headingLevel: 3, eyebrow: it.km + ' km', title: it.t }); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(A.Collection, { label: 'Destinos', items: D, minItemWidth: 180, renderItem: celda }), h(A.Collection, { label: 'Destinos, en fila', layout: 'row', items: D, minItemWidth: 200, renderItem: celda })));
</script>
