<!-- @dsCard group="Menús" height=460 subtitle="Acciones de un botón · grupos, atajos, ítems marcados y un submenú" -->
<div id="root" style="padding:24px;min-height:400px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  var h = React.createElement, A = AlmaDS;
  function App() {
    var orden = React.useState('fecha'), solo = React.useState(false);
    return h(React.Fragment, null,
      h(A.PullDownButton, { label: 'Tarjeta', icon: 'purchase',
        actions: [{ value: 'copy', label: 'Copiar número', icon: 'copy', shortcut: 'Ctrl+C' }, { value: 'freeze', label: 'Congelar tarjeta', icon: 'snowflake' }, { value: 'limit', label: 'Cambiar límite…', icon: 'settings--adjust' }, '-', { value: 'delete', label: 'Eliminar tarjeta…', icon: 'trash-can', role: 'destructive' }] }),
      h(A.PullDownButton, { label: 'Ver', title: 'Mis viajes',
        onAction: function (v) { if (v === 'solo') solo[1](!solo[0]); else if (['fecha', 'precio', 'destino'].indexOf(v) >= 0) orden[1](v); },
        actions: [{ value: 'orden', label: 'Ordenar por', items: [{ value: 'fecha', label: 'Fecha', checked: orden[0] === 'fecha', radio: true }, { value: 'precio', label: 'Precio', checked: orden[0] === 'precio', radio: true }, { value: 'destino', label: 'Destino', checked: orden[0] === 'destino', radio: true }] },
          { value: 'solo', label: 'Solo los pagados', checked: solo[0] }, '-', { value: 'actualizar', label: 'Actualizar', shortcut: 'Ctrl+R' }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
