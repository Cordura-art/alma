<div id="root" style="padding:64px 24px 24px;display:flex;gap:16px;"></div>
<script>
  // The gallery frame makes html and body transparent; paint the page color of the ALMA theme (inline !important wins).
  document.documentElement.style.setProperty('background', 'var(--ui-02)', 'important');
  var h = React.createElement, A = AlmaDS;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(A.Tooltip, { text: 'Copiar el número de la tarjeta' }, h(A.Button, { variant: 'gray', icon: 'copy', 'aria-label': 'Copiar' })),
    h(A.Tooltip, { text: 'Congelar la tarjeta hasta que la reactives' }, h(A.Button, { variant: 'gray', icon: 'snowflake', 'aria-label': 'Congelar' })),
    h(A.Tooltip, { text: 'Restaurar los ajustes de fábrica', placement: 'bottom' }, h(A.Button, { variant: 'plain' }, 'Restaurar'))
  ));
</script>
